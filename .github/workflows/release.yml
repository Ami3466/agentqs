# Build + publish the agentqs image to GHCR:
#   - push to `main`           -> :latest (+ :sha-<short>)
#   - `git tag vX.Y.Z && push` -> :X.Y.Z + :X.Y + :latest
# The package is PUBLIC (any host can pull it anonymously), as is the source repo.
# Nothing here publishes to npm, and nothing here knows about any specific
# host - deploying/redeploying is the host's job (whatever pulls this image decides
# when to roll it), which keeps this repo free of deploy credentials or coupling.
#
# Why an image at all: a host that BUILDS from source spends ~4 min of a small VPS's
# CPU doing what CI already did. Pulling the image means the record's machine never
# sees the code, a deploy is seconds, and a rollback is the previous tag.
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # Docs-only pushes don't change the image, so they don't rebuild it. A version
    # tag is a deliberate release - if you ever tag a docs-only commit, run the
    # workflow manually (workflow_dispatch) to publish it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. edge). The digest is always tagged too."
        required: false
        default: "edge"

env:
  REGISTRY: ghcr.io

jobs:
  # Fails in ~a minute on the thing that has actually broken this pipeline: a module
  # that exists on the author's disk but was never committed. CI checks out only the
  # TRACKED tree, so the import resolves to nothing — and buried in a three-minute
  # docker build, that reads as "the image failed" rather than "you forgot to
  # `git add`". Same check runs locally as `npm run verify:tree` (against the tree
  # git would push, not the working directory), so it should never get this far.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check the committed tree
        run: npx tsc --noEmit

  # One job per architecture, each on a runner of that architecture. amd64 is the
  # VPS; arm64 is every Apple Silicon laptop - without it `docker pull` on a Mac
  # fails with "no matching manifest for linux/arm64/v8", which is not a warning,
  # it is a dead end. The obvious alternative - one job building both under QEMU -
  # emulates node for the whole Next.js build of a native-heavy image (onnxruntime,
  # better-sqlite3) and turns a 7-minute release into tens of minutes. Native
  # runners build both in parallel at full speed.
  #
  # Each job pushes an untagged manifest by digest only; `merge` stitches the
  # digests into one multi-arch tag. That is what makes the two builds independent -
  # neither has to know the other's tags, and a tag never points at half an image.
  # onnxruntime has no musl build, which is why the Dockerfile is Debian - do not
  # "optimize" it to alpine here.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GITHUB_REPOSITORY is `Ami3466/agentqs` but a Docker ref must be lowercase,
      # so the raw `name=` below needs ${,,}. metadata-action lowercases on its own -
      # anything hand-written does not.
      - name: Resolve names
        run: |
          echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only - the tags are applied once, in `merge`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REF }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,name-canonical=true,push=true
          # Separate scopes: one shared cache would have the two architectures
          # overwriting each other's layers every run.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Turn the per-architecture digests into ONE tag that resolves per-puller: a Mac
  # gets arm64, the VPS gets amd64, from the same `:latest`.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Every tag in this list was just pointed at the same index by the single
      # `imagetools create` call below and passed the smoke test at the bottom of
      # this job - so the mirror job can copy from any one of them instead of
      # recomputing tags itself and risking a different answer.
      published_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve names
        run: echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # v0.2.0 -> :0.2.0, :0.2, :latest. A manual run -> :edge (or whatever was typed).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          # The per-arch `build` job already sets labels on each child config - the
          # index is the gap: registries/UIs read the index, and imagetools leaves it
          # `annotations: null` unless told otherwise. metadata-action already emits
          # .annotations in DOCKER_METADATA_OUTPUT_JSON; a bash array (not jq|join)
          # because the values contain spaces and would otherwise word-split.
          # metadata-action pre-scopes each entry as "manifest:<key>=<value>" (for the
          # per-arch labels above); the index wants the same keys unscoped, so strip
          # that prefix before adding ours - "index:manifest:<key>" would otherwise
          # make buildx read "index:" as the scope and keep "manifest:<key>" as the
          # literal key name, which is how this shipped broken the first time.
          ANNOTATIONS=()
          while IFS= read -r a; do
            [ -n "$a" ] && ANNOTATIONS+=(--annotation "index:${a#manifest:}")
          done < <(jq -r '.annotations // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create \
            "${ANNOTATIONS[@]}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_REF }}@sha256:%s ' *)

      - name: Check both architectures are in the published tag
        run: |
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' > /tmp/idx.json
          for arch in amd64 arm64; do
            jq -e --arg a "$arch" '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux")' /tmp/idx.json > /dev/null \
              || { echo "$TAG has no linux/$arch — a pull on that platform would fail"; jq . /tmp/idx.json; exit 1; }
            echo "linux/$arch present"
          done
          # The annotation scoping/stripping above is easy to get subtly wrong (it
          # already shipped broken once) and a bad key silently degrades to "no
          # metadata" instead of erroring, so assert one plain key actually landed.
          # `--format '{{json .Manifest}}'` isn't guaranteed to carry the index's
          # top-level .annotations (only .manifests[], which the arch check above
          # relies on) - `--raw` is a separate call because it can't combine with
          # --format, and it's the registry-truth view: the index JSON exactly as
          # stored, annotations included, so this can't false-fail on a format gap.
          docker buildx imagetools inspect "$TAG" --raw > /tmp/idx-raw.json
          SOURCE=$(jq -r '.annotations["org.opencontainers.image.source"] // empty' /tmp/idx-raw.json)
          [ -n "$SOURCE" ] \
            || { echo "$TAG index has no org.opencontainers.image.source annotation - index annotations regressed"; jq . /tmp/idx-raw.json; exit 1; }
          echo "index annotations present (org.opencontainers.image.source=$SOURCE)"

      # The image is the artifact, so it has to actually boot. Pull the image we just
      # tagged, run it on a throwaway /data, and require a real HTTP answer - a build
      # that compiles and then dies on start is not a release. This runner is amd64,
      # so this exercises the amd64 half; the arm64 half is covered by the manifest
      # check above plus its own native build.
      - name: Smoke-test the published image
        run: |
          IMG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker run -d --name qs -p 3000:3000 -v /tmp/qs-data:/data "$IMG"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != "000" ] && [ "$code" != "" ]; then
              echo "image answered HTTP $code"
              docker rm -f qs
              exit 0
            fi
            sleep 2
          done
          echo "image never answered on :3000"
          docker logs qs
          docker rm -f qs
          exit 1

  # `ghcr.io/ami3466/agentqs:latest` can never be a short name; this copies the
  # exact index `merge` just built, annotated, and smoke-tested onto Docker Hub so
  # `docker run flowenginecloud/agentqs` works too. It must never rebuild - a
  # second build could produce different digests and ship bits the smoke test
  # above never ran - so every step below is a registry-to-registry copy, not a
  # `docker build`.
  #
  # continue-on-error: true because this is a convenience mirror, not the release.
  # GHCR is the artifact of record; if Docker Hub is down or the token is wrong,
  # the release that already shipped above must not be marked failed for it.
  mirror-dockerhub:
    needs: merge
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # The `secrets` context can't be read in a job-level `if:` (it silently
      # evaluates to false there, which would skip this whole job with no
      # explanation) - only `run:`/`with:` can see it. So the gate is a step output
      # instead, checked on every step after it. Do NOT collapse this back into a
      # job-level `if: secrets.DOCKERHUB_TOKEN != ''` - that was the first draft,
      # and it just silently never runs.
      - name: Check Docker Hub credentials are configured
        id: creds
        run: echo "enabled=${{ secrets.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.enabled == 'true'

      # Username and target are deliberately different accounts: this logs in as
      # the personal account that holds the token (same identity FlowEngine's
      # build-n8n-image.yml uses), then the copy step below pushes INTO an org
      # that account owns. Do not "fix" DOCKERHUB_REPO to match this username -
      # flowenginecloud is the org namespace on purpose, not a typo of ami3466.
      - uses: docker/login-action@v3
        if: steps.creds.outputs.enabled == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'ami3466' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve names
        if: steps.creds.outputs.enabled == 'true'
        run: |
          echo "HUB_REF=${{ vars.DOCKERHUB_REPO || 'flowenginecloud/agentqs' }}" >> $GITHUB_ENV
          # Any tag `merge` published points at the identical index it just
          # verified and smoke-tested - the first one is a fine copy source.
          echo "SOURCE=$(head -1 <<< '${{ needs.merge.outputs.published_tags }}')" >> $GITHUB_ENV

      # SAME tags: block as `merge`'s meta step, aimed at the Hub ref instead of
      # GHCR, so Hub gets 0.3.0 / 0.3 / latest / sha-* on exactly the same rules.
      # metadata-action can't take two `images:` in one call, which is the only
      # reason this block is typed twice - if you change one, change both.
      - id: meta
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HUB_REF }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # imagetools copies blobs cross-registry from the GHCR tag `merge` published -
      # it never touches a Dockerfile, so Hub ends up with the exact digests GHCR
      # has, not a rebuild that could drift from what the smoke test ran.
      - name: Copy the published index to Docker Hub
        if: steps.creds.outputs.enabled == 'true'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$SOURCE"

      # Same check `merge` runs on the GHCR side - a mirror that silently drops an
      # architecture is the exact bug this repo already spent a session fixing.
      # `continue-on-error` on the job (not this step) is what keeps a real miss
      # here from failing the workflow; it still fails the JOB, which shows up red
      # in the run instead of pretending the mirror is healthy.
      - name: Check Docker Hub has both architectures
        if: steps.creds.outputs.enabled == 'true'
        run: |
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' > /tmp/hub-idx.json
          for arch in amd64 arm64; do
            jq -e --arg a "$arch" '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux")' /tmp/hub-idx.json > /dev/null \
              || { echo "$TAG has no linux/$arch - Hub silently missed an architecture GHCR has"; jq . /tmp/hub-idx.json; exit 1; }
            echo "linux/$arch present on Hub"
          done
