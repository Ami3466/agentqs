# Build + publish the agentqs image to GHCR:
#   - push to `main`           -> :latest (+ :sha-<short>)
#   - `git tag vX.Y.Z && push` -> :X.Y.Z + :X.Y + :latest
# The package is PUBLIC (any host can pull it anonymously); the source repo stays
# private. Nothing here publishes to npm, and nothing here knows about any specific
# host - deploying/redeploying is the host's job (whatever pulls this image decides
# when to roll it), which keeps this repo free of deploy credentials or coupling.
#
# Why an image at all: a host that BUILDS from source spends ~4 min of a small VPS's
# CPU doing what CI already did. Pulling the image means the record's machine never
# sees the code, a deploy is seconds, and a rollback is the previous tag.
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. edge). The digest is always tagged too."
        required: false
        default: "edge"
      platforms:
        description: "Target platforms. Default is amd64 only (the deploy target). Add arm64 for laptop use - it builds under QEMU emulation and is much slower."
        required: false
        default: "linux/amd64"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.0 -> :0.2.0, :0.2, :latest. A manual run -> :edge (or whatever was typed).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # amd64 is the deploy target (the VPS). arm64 is opt-in via the
      # workflow_dispatch `platforms` input - it builds under QEMU emulation, which
      # for a native-heavy image (onnxruntime, the local embedder behind `recall`)
      # is minutes-to-tens-of-minutes slower and can hang, so it does NOT gate a
      # release. onnxruntime has no musl build, which is why the Dockerfile is
      # Debian - do not "optimize" it to alpine here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is the artifact, so it has to actually boot. Pull the amd64 image
      # we just pushed, run it on a throwaway /data, and require a real HTTP answer -
      # a build that compiles and then dies on start is not a release.
      - name: Smoke-test the pushed image
        run: |
          IMG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          docker run -d --name qs -p 3000:3000 -v /tmp/qs-data:/data "$IMG"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != "000" ] && [ "$code" != "" ]; then
              echo "image answered HTTP $code"
              docker rm -f qs
              exit 0
            fi
            sleep 2
          done
          echo "image never answered on :3000"
          docker logs qs
          docker rm -f qs
          exit 1
